name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every 6 hours so data fetched at build time stays current: fantasy
  # deadlines (and the calendar built from them) pick up rescheduled kickoffs,
  # and the Cricket tab's Leaders stats refresh. The 06:00 UTC run falls after
  # the day's Asian, European and Caribbean matches have finished.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      # Never fails the build: if Cricinfo can't be reached, the committed
      # src/data/cricketLeaders.json is used and the log says so.
      - name: Fetch cricket leaders
        run: npm run stats:cricket

      # Never fails the build either: a league whose source is down keeps the
      # rounds in the committed src/data/fantasyDeadlines.json. Also writes
      # public/fantasy-deadlines.ics, served as the subscribable calendar.
      - name: Fetch fantasy deadlines
        run: npm run fantasy:deadlines

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CRICAPI_KEY: ${{ secrets.VITE_CRICAPI_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - uses: actions/deploy-pages@v4
        id: deploy
